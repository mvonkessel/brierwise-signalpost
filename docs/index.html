<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Signalpost company profiles</title><style>
:root{--bg:#fbfbf8;--fg:#1d1f21;--mut:#5d6166;--line:#dcdcd5;--card:#fff;--acc:#1f5f8b;--ok:#2f7d4f;--warn:#9a6b00;
--bad:#a33a2a;--chip:#eef1f4}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--fg:#e8e8e3;--mut:#a3a7ad;--line:#33373c;--card:#1d2024;
--acc:#7fb3dc;--ok:#7cc79a;--warn:#e0b24f;--bad:#ef8a7a;--chip:#262a2f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,
"Segoe UI",Roboto,sans-serif}a{color:var(--acc)}header{padding:16px;border-bottom:1px solid var(--line)}
main{max-width:1100px;margin:0 auto;padding:16px}h1{font-size:1.35rem;margin:0 0 4px}h2{font-size:1.1rem;
margin:24px 0 8px}.mut{color:var(--mut)}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;
padding:12px 14px;margin:10px 0}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search]{width:100%;padding:10px 12px;font-size:1rem;border:1px solid var(--line);border-radius:6px;
background:var(--card);color:var(--fg)}label.chip,.chip{display:inline-block;background:var(--chip);border-radius:999px;
padding:3px 10px;font-size:.85rem;margin:2px 4px 2px 0}.st-available{color:var(--ok)}.st-ambiguous,.st-blocked
{color:var(--warn)}.st-failed{color:var(--bad)}.st-not_available,.st-not_applicable{color:var(--mut)}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;
vertical-align:top}th{font-weight:600}sup a{text-decoration:none;font-size:.75rem}.ev{font-size:.85rem;
word-break:break-word}.list .item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}td.when{white-space:nowrap}button{padding:8px 14px;border-radius:6px;border:1px solid
var(--acc);background:var(--acc);color:#fff;font-size:.95rem}button:disabled{opacity:.45}
.acc th:first-child{position:sticky;left:0;background:var(--card);z-index:1}
.sig{border-left:3px solid var(--acc);padding-left:10px;font-weight:500}select{padding:7px 8px;border-radius:6px;
border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:.9rem}
.badges{white-space:normal}
@media (max-width:640px){.hide-s{display:none}td,th{padding:5px 4px}.list .item{grid-template-columns:auto 1fr}
.list .item>.num{grid-column:2;text-align:left}}
</style></head><body><header><h1>Norwegian company profiles</h1><div class=mut>100 companies · every fact links to its source · by Brierwise (AI agent)</div></header><main><input id=q type=search placeholder="Search name, organisation number, municipality or industry" aria-label=Search><div class=row><label class=chip><input type=checkbox data-f=web> verified website</label><label class=chip><input type=checkbox data-f=jobs> hiring</label><label class=chip><input type=checkbox data-f=acc> accounts found</label><label class=chip><input type=checkbox data-f=active> active</label><select id=sort aria-label="Sort by"><option value=n>Name A–Z</option><option value=r>Revenue, highest first</option><option value=e>Employees, most first</option><option value=a>Latest news first</option></select><span id=cnt class=mut></span><button id=cmp disabled>Compare selected (2 to 4)</button></div><div id=list class=list></div></main><script src="data.js"></script><script>
const D=window.SIGNALPOST;const q=document.getElementById('q');const list=document.getElementById('list');
const sel=new Set();const cmp=document.getElementById('cmp');const sort=document.getElementById('sort');
const cf=new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1});
const F={web:x=>!!x.w,jobs:x=>x.j>0,acc:x=>x.r!=null,active:x=>x.s==='active'};const on=new Set();
document.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('change',ev=>{ev.target.checked?on.add(ev.target.
dataset.f):on.delete(ev.target.dataset.f);draw()}));
const by=k=>(a,b)=>{const x=a[k],y=b[k];return x==null?(y==null?0:1):y==null?-1:(y>x?1:y<x?-1:0)};
function draw(){const t=q.value.trim().toLowerCase();let n=0;const rows=[];const S=sort.value==='n'?D:[...D].sort(
by(sort.value));for(const x of S){if(t&&!(x.n+' '+x.o+' '+
(x.m||'')+' '+(x.i||'')).toLowerCase().includes(t))continue;let ok=true;for(const f of on)if(!F[f](x))ok=false;
if(!ok)continue;if(++n>400)break;rows.push(`<div class="card item"><input type=checkbox aria-label="compare ${x.n}"
 ${sel.has(x.o)?'checked':''} onchange="tog('${x.o}',this.checked)"><div><a href="company/${x.o}.html">${esc(x.n)}</a>
<div class=mut>${x.o} · ${x.f||''} · ${esc(tc(x.m||''))} · ${esc(x.i||'')}</div></div><div class=num>${
x.r!=null?esc(x.rc||'')+' '+cf.format(x.r)+' <span class=mut>'+esc(x.ry||'')+'</span>':''}<div class="mut badges">${[x.e!=null?
x.e+' staff':'',x.w?'website':'',x.p?x.p+' profiles':'',x.j?x.j+' jobs':'',x.a?'news '+esc(x.a.slice(0,7)):''].filter(
Boolean).join(' · ')}</div></div></div>`)}list.innerHTML=rows.join('')||'<p class=mut>No company matches.</p>';
document.getElementById('cnt').textContent=n>400?'first 400 shown':n+' shown'}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function tc(s){return String(s).toLowerCase().replace(/(^|[\s-])\S/g,c=>c.toUpperCase())}
function tog(o,c){c?sel.add(o):sel.delete(o);cmp.disabled=sel.size<2||sel.size>4}
cmp.addEventListener('click',()=>location.href='compare.html#'+[...sel].join(','));q.addEventListener('input',draw);
sort.addEventListener('change',draw);draw();
</script></body></html>
